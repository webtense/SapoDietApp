name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sapofit_test
          POSTGRES_USER: sapofit
          POSTGRES_PASSWORD: sapofit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sapofit -d sapofit_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://sapofit:sapofit_test@localhost:5432/sapofit_test
      NODE_ENV: test
      SESSION_COOKIE_NAME: sapofit_session
      SESSION_DAYS: "7"
      APP_URL: http://localhost:3000
      CRON_SECRET: test-cron-secret

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Deploy database migrations
        run: npm run db:deploy

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
