name: Android

on:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - "package.json"
      - ".github/workflows/android.yml"
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # JDK 21: el módulo generado por "capacitor-health" fija
      # sourceCompatibility/targetCompatibility = VERSION_21 (ver
      # mobile/android/app/capacitor.build.gradle). JDK 17 no puede compilarlo.
      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Los runners ubuntu-latest de GitHub ya traen Android SDK preinstalado
      # en $ANDROID_HOME. "android-actions/setup-android@v3" falla hoy porque
      # intenta instalar el paquete legacy "tools" (retirado del repositorio
      # de Google) incluso cuando no hace falta, así que se evita y solo se
      # asegura la plataforma/build-tools que necesita este proyecto.
      - name: Ensure Android SDK platform/build-tools
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          find "$ROOT" -maxdepth 3 -iname "sdkmanager*" 2>/dev/null || true
          SDKMANAGER=$(find "$ROOT" -maxdepth 4 -iname "sdkmanager" -type f 2>/dev/null | sort -V | tail -1)
          if [ -z "$SDKMANAGER" ]; then
            echo "No se encontró sdkmanager preinstalado; instalando cmdline-tools manualmente"
            CMDTOOLS_DIR="$ROOT/cmdline-tools/latest"
            mkdir -p "$ROOT/cmdline-tools"
            curl -fsSL -o /tmp/cmdline-tools.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
            unzip -q /tmp/cmdline-tools.zip -d "$ROOT/cmdline-tools"
            mv "$ROOT/cmdline-tools/cmdline-tools" "$CMDTOOLS_DIR"
            SDKMANAGER="$CMDTOOLS_DIR/bin/sdkmanager"
          fi
          echo "Using sdkmanager at $SDKMANAGER"
          echo "ANDROID_SDK_ROOT=$ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --sdk_root="$ROOT" --licenses >/dev/null || true
          "$SDKMANAGER" --sdk_root="$ROOT" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Install mobile/ dependencies
        working-directory: mobile
        run: npm install --no-audit --no-fund

      - name: Sync Capacitor Android project
        working-directory: mobile
        run: npx cap sync android

      - name: Decode signing keystore
        run: |
          mkdir -p mobile/android/app/keystore
          echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > mobile/android/app/keystore/release.keystore

      - name: Resolve version from package.json
        id: ver
        run: |
          VERSION=$(node -p "require('./package.json').version")
          # versionCode entero y creciente a partir del run number de GitHub Actions
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "versionCode=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build signed release APK
        working-directory: mobile/android
        env:
          SAPOFIT_KEYSTORE_PATH: app/keystore/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PappVersionName="${{ steps.ver.outputs.version }}" \
            -PappVersionCode="${{ steps.ver.outputs.versionCode }}" \
            --no-daemon

      - name: Remove keystore from runner
        if: always()
        run: rm -f mobile/android/app/keystore/release.keystore

      - name: Collect APK and checksum
        id: artifact
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p dist
          SRC="mobile/android/app/build/outputs/apk/release/app-release.apk"
          DEST="dist/sapofit-${VERSION}.apk"
          cp "$SRC" "$DEST"
          SHA256=$(sha256sum "$DEST" | cut -d' ' -f1)
          cat > dist/latest.json <<EOF
          {
            "version": "${VERSION}",
            "versionCode": ${{ steps.ver.outputs.versionCode }},
            "sha256": "${SHA256}",
            "fileName": "sapofit-${VERSION}.apk",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: sapofit-android-${{ steps.ver.outputs.version }}
          path: |
            dist/*.apk
            dist/latest.json
          retention-days: 90

      - name: Summary
        run: |
          echo "### SapoFit Android ${{ steps.ver.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "SHA-256: \`${{ steps.artifact.outputs.sha256 }}\`" >> "$GITHUB_STEP_SUMMARY"
