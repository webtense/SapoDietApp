name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync sources to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --exclude backups --exclude docker-compose.yml \
            --exclude easypanel.json --exclude backup.sh \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ root@${{ secrets.VPS_HOST }}:/opt/sapofit/

      - name: Build image and update service
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="sapofit:v${VERSION}-${SHA::7}"
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.VPS_HOST }} bash -s <<EOS
            set -euo pipefail
            cd /opt/sapofit
            docker build -t "$TAG" .
            docker service update --force --image "$TAG" sapofit
            docker image prune -f --filter "until=168h" >/dev/null || true
          EOS
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          for i in $(seq 1 20); do
            LIVE=$(curl -fsS https://sapofit.semillasdeti.com/api/version | node -p "JSON.parse(require('fs').readFileSync(0)).version" || true)
            if [ "$LIVE" = "$VERSION" ]; then echo "OK: producción sirve v$LIVE ($TAG)"; exit 0; fi
            echo "esperando... (live=$LIVE, esperado=$VERSION)"; sleep 10
          done
          echo "ERROR: producción no sirve v$VERSION"; exit 1
