name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Build image on runner
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_ID="${VERSION}-${SHA::7}"
          TAG="sapofit:v${BUILD_ID}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          docker build -t "$TAG" \
            --build-arg NEXT_PUBLIC_BUILD_ID="$BUILD_ID" \
            --build-arg BUILD_TIME="$BUILD_TIME" .
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Ship image and restart app
        run: |
          SSH="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.VPS_HOST }}"
          docker save "$TAG" | gzip | $SSH 'gunzip | docker load'
          $SSH bash -s <<EOS
            set -euo pipefail
            cd /opt/sapofit-ops
            sed -i "s/^SAPOFIT_TAG=.*/SAPOFIT_TAG=${TAG#sapofit:}/" prod.env
            docker compose -p sapofit --env-file prod.env -f docker-compose.prod.yml up -d --no-deps sapofit
            docker image prune -f --filter "until=168h" >/dev/null || true
          EOS

      - name: Verify deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_ID="${{ env.BUILD_ID }}"
          for i in $(seq 1 20); do
            RESPONSE=$(curl -fsS https://sapofit.semillasdeti.com/api/version || echo '{}')
            LIVE_VERSION=$(echo "$RESPONSE" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo '')
            LIVE_BUILD=$(echo "$RESPONSE" | node -p "JSON.parse(require('fs').readFileSync(0)).buildId" 2>/dev/null || echo '')
            if [ "$LIVE_VERSION" = "$VERSION" ] && [ "$LIVE_BUILD" = "$BUILD_ID" ]; then
              echo "✅ OK: producción sirve v$LIVE_VERSION (build $LIVE_BUILD)"
              exit 0
            fi
            echo "⏳ esperando... (live=$LIVE_VERSION/$LIVE_BUILD, esperado=$VERSION/$BUILD_ID)"
            sleep 10
          done
          echo "❌ ERROR: producción no sirve v$VERSION build $BUILD_ID"
          exit 1
