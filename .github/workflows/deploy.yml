name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.VPS_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Sync sources to VPS
        run: |
          rsync -az --delete \
            --exclude node_modules --exclude .next --exclude .git \
            --exclude '.env*' --exclude backups --exclude docker-compose.yml \
            --exclude easypanel.json --exclude backup.sh \
            -e "ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes" \
            ./ root@${{ secrets.VPS_HOST }}:/opt/sapofit/

      - name: Build image and update service
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_ID="${VERSION}-${SHA::7}"
          TAG="sapofit:v${BUILD_ID}"
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes root@${{ secrets.VPS_HOST }} bash -s <<EOS
            set -euo pipefail
            cd /opt/sapofit
            docker build -t "$TAG" --build-arg NEXT_PUBLIC_BUILD_ID="$BUILD_ID" --build-arg BUILD_TIME="$BUILD_TIME" .
            docker service update --force --image "$TAG" sapofit
            docker image prune -f --filter "until=168h" >/dev/null || true
          EOS
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"

      - name: Verify deployment
        run: |
          VERSION=$(node -p "require('./package.json').version")
          BUILD_ID="${{ env.BUILD_ID }}"
          for i in $(seq 1 20); do
            RESPONSE=$(curl -fsS https://sapofit.semillasdeti.com/api/version || echo '{}')
            LIVE_VERSION=$(echo "$RESPONSE" | node -p "JSON.parse(require('fs').readFileSync(0)).version" 2>/dev/null || echo '')
            LIVE_BUILD=$(echo "$RESPONSE" | node -p "JSON.parse(require('fs').readFileSync(0)).buildId" 2>/dev/null || echo '')
            if [ "$LIVE_VERSION" = "$VERSION" ] && [ "$LIVE_BUILD" = "$BUILD_ID" ]; then
              echo "✅ OK: producción sirve v$LIVE_VERSION (build $LIVE_BUILD)"
              exit 0
            fi
            echo "⏳ esperando... (live=$LIVE_VERSION/$LIVE_BUILD, esperado=$VERSION/$BUILD_ID)"
            sleep 10
          done
          echo "❌ ERROR: producción no sirve v$VERSION build $BUILD_ID"
          exit 1
