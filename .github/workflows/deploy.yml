name: Deploy to Easypanel

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Staging (Main Branch)
        if: github.ref == 'refs/heads/main'
        run: |
          curl -X POST "${{ secrets.EASYPANEL_STAGING_WEBHOOK }}"
          
      - name: Deploy to Production (Tags)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          curl -X POST "${{ secrets.EASYPANEL_PROD_WEBHOOK }}"
